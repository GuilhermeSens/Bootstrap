<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Produtos</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body data-spy="scroll" data-target="#menu">

<nav id="menu" class="navbar navbar-light bg-light fixed-top">
  <a class="navbar-brand" href="#">Produtos</a>
</nav>

<div class="container" style="margin-top:80px;">

  <h3>Cadastro de Produto</h3>

  <form>
    <input class="form-control mb-2" placeholder="Nome">

    
    <select class="custom-select mb-2">
      <option>Categoria</option>
      <option>Eletrônico</option>
      <option>Roupas</option>
    </select>

    
    <div class="custom-control custom-switch mb-2">
      <input type="checkbox" class="custom-control-input" id="ativo">
      <label class="custom-control-label" for="ativo">Ativo</label>
    </div>

    
    <label>Preço</label>
    <input type="range" class="custom-range mb-3">

    <button class="btn btn-primary">Salvar</button>
  </form>

  <hr>

  
  <input class="form-control mb-2" id="filtro" placeholder="Filtrar...">

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Produto</th>
        <th>Categoria</th>
      </tr>
    </thead>
    <tbody id="tabela">
      <tr><td>Mouse</td><td>Eletrônico</td></tr>
      <tr><td>Camiseta</td><td>Roupas</td></tr>
    </tbody>
  </table>

</div>

<script>
document.getElementById("filtro").addEventListener("keyup", function() {
  let valor = this.value.toLowerCase();
  let linhas = document.querySelectorAll("#tabela tr");

  linhas.forEach(linha => {
    linha.style.display = linha.innerText.toLowerCase().includes(valor) ? "" : "none";
  });
});
</script>

</body>
</html>
