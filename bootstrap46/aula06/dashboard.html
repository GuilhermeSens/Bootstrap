<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>

  
  <link rel="stylesheet" href="style.css">

  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>

<body>


<nav class="navbar navbar-dark bg-dark">
  <a class="navbar-brand" href="#">Dashboard</a>
  <a href="produtos.html" class="btn btn-success">Produtos</a>
</nav>

<div class="container mt-4">

  
  <div id="carouselExample" class="carousel slide mb-4" data-ride="carousel">
    
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://picsum.photos/800/300?random=1" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/800/300?random=2" class="d-block w-100">
      </div>

      <div class="carousel-item">
        <img src="https://picsum.photos/800/300?random=3" class="d-block w-100">
      </div>

    </div>

    
    <a class="carousel-control-prev" href="#carouselExample" data-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </a>

    <a class="carousel-control-next" href="#carouselExample" data-slide="next">
      <span class="carousel-control-next-icon"></span>
    </a>

  </div>

  
  <div class="d-flex justify-content-between text-center">

    <div class="p-3 bg-primary text-white w-30">
      <h5>Vendas</h5>
      <p>120</p>
    </div>

    <div class="p-3 bg-success text-white w-30">
      <h5>Clientes</h5>
      <p>80</p>
    </div>

    <div class="p-3 bg-danger text-white w-30">
      <h5>Pedidos</h5>
      <p>45</p>
    </div>

  </div>

  
  <button class="btn btn-info mt-4" data-toggle="tooltip" title="Isso é um tooltip!">
    Passe o mouse aqui
  </button>

  
  <button class="btn btn-warning mt-4" data-toggle="modal" data-target="#modalExemplo">
    Abrir Modal
  </button>

  <div class="modal fade" id="modalExemplo">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Exemplo de Modal</h5>
          <button class="close" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body">
          Este é um modal funcionando com Bootstrap 4.6.
        </div>

      </div>
    </div>
  </div>

  
  <button class="btn btn-dark mt-4" onclick="mostrarToast()">
    Mostrar Toast
  </button>

  <div class="toast position-fixed" style="top:20px; right:20px;" data-delay="3000">
    <div class="toast-body bg-success text-white">
      Ação realizada com sucesso!
    </div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(function () {
  $('[data-toggle="tooltip"]').tooltip()
})

function mostrarToast(){
  $('.toast').toast('show')
}
</script>

</body>
</html>
